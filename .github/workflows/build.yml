name: Build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    # WPF needs Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The .slnx solution needs SDK 9.0.200 or later; the tests run on .NET 8.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test
        run: dotnet test Revit.Themes.slnx --configuration Release

      - name: Pack
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '0.0.0-ci.${{ github.run_number }}' }
          dotnet pack src/Revit.Themes/Revit.Themes.csproj --configuration Release --output artifacts -p:Version=$version

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*

      # A tag such as v0.1.0 publishes that version; it needs a NUGET_API_KEY repository secret.
      - name: Publish to nuget.org
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
